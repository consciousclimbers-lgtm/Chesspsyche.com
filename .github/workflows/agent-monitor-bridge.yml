# GitHub-only event report. No external receiver, secrets, or agent endpoint.
# This workflow never checks out or executes pull-request code.
name: Agent monitoring report

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Regression tests", "Live Guardian"]
    types: [completed]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-monitor-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  report:
    name: Write GitHub event summary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Checkout only trusted default-branch code. Never check out PR head code.
      - name: Check out trusted summary builder
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Write allow-listed metadata to the GitHub Actions summary
        run: python3 tools/agent-bridge/monitor_summary.py
