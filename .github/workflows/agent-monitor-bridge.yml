# Event bridge for an independent ChessPsyche monitoring agent.
# This workflow does not merge, deploy, edit repository content, or change permissions.
# After this PR is reviewed/merged, configure repository Actions secrets:
#   CHESSPSYCHE_AGENT_WEBHOOK_URL   HTTPS endpoint for your agent/webhook receiver
#   CHESSPSYCHE_AGENT_WEBHOOK_TOKEN Bearer token expected by that receiver
# Without both secrets, the workflow records a clear warning and exits successfully.
name: Agent monitoring bridge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Regression tests", "Live Guardian"]
    types: [completed]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-monitor-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  notify-agent:
    name: Notify external monitoring agent
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Forward event or explain missing configuration
        shell: bash
        env:
          AGENT_WEBHOOK_URL: ${{ secrets.CHESSPSYCHE_AGENT_WEBHOOK_URL }}
          AGENT_WEBHOOK_TOKEN: ${{ secrets.CHESSPSYCHE_AGENT_WEBHOOK_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          if [ -z "$AGENT_WEBHOOK_URL" ] || [ -z "$AGENT_WEBHOOK_TOKEN" ]; then
            {
              echo "## Agent monitoring bridge: NOT CONFIGURED"
              echo "No event was forwarded. Configure repository Actions secrets"
              echo CHESSPSYCHE_AGENT_WEBHOOK_URL and CHESSPSYCHE_AGENT_WEBHOOK_TOKEN
              echo "after an HTTPS event receiver/agent has been created."
              echo "This is an expected setup warning, not a test pass and not a failed application test."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Agent bridge not configured::Set both CHESSPSYCHE_AGENT_WEBHOOK_URL and CHESSPSYCHE_AGENT_WEBHOOK_TOKEN to enable automatic agent reviews."
            exit 0
          fi

          payload=$(jq -n \
            --arg event "$EVENT_NAME" \
            --arg repository "$REPOSITORY" \
            --arg sha "$SHA" \
            --arg ref "$REF" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
            --slurpfile body "$EVENT_PATH" '
            {
              event: $event,
              repository: $repository,
              sha: $sha,
              ref: $ref,
              run_id: $run_id,
              run_url: $run_url,
              action: ($body[0].action // null),
              pull_request_number: (
                $body[0].pull_request.number //
                $body[0].issue.number //
                $body[0].workflow_run.pull_requests[0].number //
                null
              ),
              pull_request_url: (
                $body[0].pull_request.html_url //
                $body[0].issue.html_url //
                $body[0].workflow_run.html_url //
                null
              ),
              pull_request_title: ($body[0].pull_request.title // null),
              workflow_name: ($body[0].workflow_run.name // null),
              workflow_conclusion: ($body[0].workflow_run.conclusion // null),
              deployment_state: ($body[0].deployment_status.state // null),
              sender: ($body[0].sender.login // null)
            }')

          # Endpoint URL and bearer token are secret; payload is public repository event metadata.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -X POST "$AGENT_WEBHOOK_URL" \
            -H "Authorization: Bearer $AGENT_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" > /tmp/agent-response.txt

          {
            echo "## Agent monitoring bridge: EVENT FORWARDED"
            echo "- Event: $EVENT_NAME"
            echo "- Commit/ref: $SHA / $REF"
            echo "- Run: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
            echo "- Receiver accepted the HTTP request. This confirms delivery only, not that the agent completed its review."
          } >> "$GITHUB_STEP_SUMMARY"
