# Runs the survey regression test and the browser click-through on every pull request to main,
# on every push to main, and on demand (Actions tab -> Regression tests -> Run workflow).
# The job is called "Regression tests"; that is the name to require in the main branch ruleset.
# The "Click-through ..." jobs repeat the click-through in other browsers and at phone size. They are
# not required by the ruleset; a browser that cannot be started there is NOT TESTED and its job fails.
name: Regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: the job only checks out the code and runs tests
permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/survey-regression
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/survey-regression/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-chromium

      - name: Install Chromium for Playwright
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Survey regression (protected code, picks, question bank, scoring, console errors)
        run: npm test 2>&1 | tee survey-regression.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Repaired ECO lines reach their code; PR #13 lines unchanged
        if: success() || failure()
        run: npm run test:eco-lines 2>&1 | tee eco-lines.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Results cards agree (name, ECO, side, Notable GM, demo board up to 20 plies, short-line note)
        if: success() || failure()
        run: npm run test:results-identity 2>&1 | tee results-identity.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Results identity test catches the old 10-ply board limit (tests the test itself)
        if: success() || failure()
        run: npm run test:results-identity-selftest 2>&1 | tee results-identity-selftest.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Browser click-through against candidate over local HTTP (Chromium desktop)
        if: success() || failure()
        run: |
          set -uo pipefail
          python3 -m http.server 4173 --directory ../.. > /tmp/chesspsyche-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/chesspsyche-http.log; echo "Candidate HTTP server did not start"; exit 1; fi
          want_sha256=$(sha256sum ../../index.html | cut -d ' ' -f1)
          set +e
          node clickthrough.js --url http://127.0.0.1:4173/index.html --expect-sha256 "$want_sha256" --browser chromium --viewport desktop --report out/report.json --shots out/screens --trace 2>&1 | tee clickthrough.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = 3 ]; then echo "::error title=NOT TESTED::chromium desktop could not be started; nothing was tested"; fi
          exit "$code"
        shell: bash

      - name: Known card issues can only shrink (pull requests; compares with the base branch)
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          node check_known_shrink.js --base FETCH_HEAD 2>&1 | tee known-shrink.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Shrink check fails closed on a missing or malformed list (tests the check itself)
        if: success() || failure()
        run: npm run test:known-shrink 2>&1 | tee known-shrink-selftest.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Live Guardian report never passes what did not run (tests the report itself)
        if: success() || failure()
        run: npm run test:guardian-report 2>&1 | tee guardian-report-selftest.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: A retried page load cannot hide an error (tests the live click-through's retries)
        if: success() || failure()
        run: npm run test:retries 2>&1 | tee retry-selftest.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Summary
        if: always()
        run: |
          {
            echo "## Regression tests on \`${GITHUB_SHA::7}\`"
            for f in survey-regression.txt eco-lines.txt results-identity.txt results-identity-selftest.txt clickthrough.txt known-shrink.txt known-shrink-selftest.txt guardian-report-selftest.txt retry-selftest.txt; do
              [ -f "$f" ] || continue
              echo "### $f"; echo '```'; cat "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            tools/survey-regression/survey-regression.txt
            tools/survey-regression/eco-lines.txt
            tools/survey-regression/results-identity.txt
            tools/survey-regression/results-identity-selftest.txt
            tools/survey-regression/clickthrough.txt
            tools/survey-regression/known-shrink.txt
            tools/survey-regression/known-shrink-selftest.txt
            tools/survey-regression/guardian-report-selftest.txt
            tools/survey-regression/retry-selftest.txt
            tools/survey-regression/out/
          if-no-files-found: ignore

  browsers:
    name: Click-through ${{ matrix.browser }} ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, viewport: mobile }
          - { browser: firefox, viewport: desktop }
          - { browser: webkit, viewport: desktop }
          - { browser: webkit, viewport: mobile }
    defaults:
      run:
        working-directory: tools/survey-regression
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/survey-regression/package-lock.json

      - run: npm ci


      - name: Browser click-through against candidate over local HTTP, ${{ matrix.browser }} ${{ matrix.viewport }}
        run: |
          set -uo pipefail
          mkdir -p out
          python3 -m http.server 4173 --directory ../.. > /tmp/chesspsyche-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/chesspsyche-http.log; echo "Candidate HTTP server did not start"; exit 1; fi
          want_sha256=$(sha256sum ../../index.html | cut -d ' ' -f1)
          set +e
          node clickthrough.js --url http://127.0.0.1:4173/index.html --expect-sha256 "$want_sha256" --browser ${{ matrix.browser }} --viewport ${{ matrix.viewport }} \
            --report out/report.json --shots out/screens --trace 2>&1 | tee out/clickthrough.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = 3 ]; then echo "::error title=NOT TESTED::${{ matrix.browser }} ${{ matrix.viewport }} could not be started; nothing was tested"; fi
          exit "$code"
        shell: bash

      - name: Summary
        if: always()
        run: |
          {
            echo "## Click-through ${{ matrix.browser }} ${{ matrix.viewport }} on \`${GITHUB_SHA::7}\`"
            echo '```'; cat out/clickthrough.txt 2>/dev/null || echo 'NOT TESTED: the click-through did not start'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clickthrough-${{ matrix.browser }}-${{ matrix.viewport }}
          path: tools/survey-regression/out/
          if-no-files-found: ignore
